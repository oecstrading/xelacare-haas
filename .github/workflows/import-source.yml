name: Import XelaCare source package
on:
  push:
    paths:
      - "source_bundle/**"
      - ".github/workflows/import-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble verified package
        run: |
          cat source_bundle/part*.txt | base64 --decode > /tmp/xelacare.tar.xz
          echo "5182b5449cd0fd92835e0f711531be29270be154ea1b29002769a351e0266acc  /tmp/xelacare.tar.xz" | sha256sum --check
          tar -tJf /tmp/xelacare.tar.xz >/dev/null
      - name: Extract application into repository
        run: tar -xJf /tmp/xelacare.tar.xz -C .
      - name: Install dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q
      - name: Commit source files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import XelaCare HaaS v0.3 application, tests and documentation"
            git push origin HEAD:main
          fi
