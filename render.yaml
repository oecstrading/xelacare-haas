# XelaCare HaaS public preview only.
# This publishes static, synthetic-data content. It does NOT deploy the clinical backend.
services:
  - type: web
    name: xelacare-global-preview
    runtime: static
    buildCommand: "echo 'Building synthetic-data preview'"
    staticPublishPath: ./preview
    autoDeployTrigger: checksPass
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'"
